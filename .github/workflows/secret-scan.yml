name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    # GitHub's own secret scanning only covers public repositories, and only
    # once enabled in the settings. gitleaks works either way and also reads
    # the git history, not just the current tree.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a secret committed and later removed is still
          # found.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan repository and history
        run: gitleaks detect --no-banner --redact --verbose
